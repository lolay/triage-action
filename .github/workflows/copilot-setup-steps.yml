name: Copilot Setup Steps

# Read by the Copilot coding agent before each session (agent-deep / agent-exec
# delegations and renovate-autofix requests). Installs the pinned actionlint and
# shellcheck so Copilot can run `make pre-commit` before it pushes. The job name
# must stay `copilot-setup-steps`. The push/pull_request triggers only exist to
# validate this file when it changes.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: make install-tools
        run: make install-tools

# CI gate: actionlint + shellcheck + dogfood smoke (uses: ./).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint · shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # actionlint + shellcheck at the Makefile pins (ACTIONLINT_VERSION,
      # SHELLCHECK_VERSION) into .tools/bin, which make lint/shellcheck prefer.
      - name: Install tools
        run: make install-tools

      - name: make ci
        run: make ci

  dogfood:
    name: dogfood smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Run local action
        id: triage
        uses: ./
        with:
          profile: ci

      - name: Report outputs
        run: |
          echo "installed CLI version: ${{ steps.triage.outputs.version }}"
          echo "exit code: ${{ steps.triage.outputs.exit-code }}"
